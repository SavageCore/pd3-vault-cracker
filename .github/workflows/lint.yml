name: Lint
on:
  push:
    branches:
      - "*"
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Install pnpm 📦
        uses: pnpm/action-setup@v6
        with:
          version: "latest"

      - name: Setup Node.js 🛠️
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies 📦
        run: |
          pnpm install

      - name: Lint with eslint 🧹
        run: |
          pnpm lint

      - name: Lint with stylelint 🧹
        run: |
          pnpm lint:styles
